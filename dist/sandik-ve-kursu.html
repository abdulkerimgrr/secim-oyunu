<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Sandık ve Kürsü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&display=swap">
<style>/* Seçim gecesi yayın grafiği havası: soğuk beyaz zemin, lacivert mürekkep,
   kırmızı son dakika ve sarı vurgu; dar başlık fontu, manşet kartlarında serif. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #14213D;
  --ink-2: #4A5672;
  --line: #DCE1EA;
  --muted: #E9EDF3;
  --accent: #D7263D;       /* son dakika kırmızısı */
  --accent-ink: #FFFFFF;
  --hi: #FFC93C;           /* sarı vurgu */
  --good: #1F8A4C;
  --warn: #C77700;
  --bad: #C0262D;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-news: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --r: 10px;
  --shadow: 0 1px 2px rgba(20, 33, 61, .06), 0 2px 8px rgba(20, 33, 61, .05);
  --tabbar: 60px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* --- Uygulama iskeleti --- */
#app { max-width: 720px; margin: 0 auto; min-height: 100%; position: relative; z-index: 1; }
/* Arka plan haritası (2023 sonuçları) */
.bgmap { position: fixed; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 40%, #F7F9FC 0%, var(--bg) 60%, #E7ECF4 100%); }
.bgmap svg { width: max(165vw, 105vh); max-width: 1600px; height: auto; flex: none; opacity: .16; transform: rotate(-4deg) translateY(4vh); filter: saturate(1.1); }
.bgmap svg path { stroke: #fff; stroke-width: 1.2; }
.bgmap-cap { display: none; position: absolute; left: 12px; bottom: calc(var(--tabbar) + 8px + env(safe-area-inset-bottom, 0px)); font-size: 10px; color: var(--ink-2); opacity: .7; letter-spacing: .02em; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: #fff; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.topbar .date { font-family: var(--f-display); font-size: 18px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
.topbar .tb-main { flex: 1; min-width: 0; }
.topbar .tb-main .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { font-size: 12px; opacity: .75; }
.topbar .spacer { flex: 1; }
.ap { display: flex; gap: 3px; }
.ap i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.25); display: block; }
.ap i.on { background: var(--hi); }
.btn-end { white-space: nowrap; background: var(--hi); color: var(--ink); border: 0; border-radius: 8px; padding: 8px 12px; font-family: var(--f-display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; }
.ticker { display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--line); overflow: hidden; height: 30px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 19; }
.ticker .tag { background: var(--accent); color: #fff; font-family: var(--f-display); font-weight: 700; padding: 0 10px; display: flex; align-items: center; font-size: 14px; letter-spacing: .05em; white-space: nowrap; }
.ticker .track { flex: 1; overflow: hidden; position: relative; }
.ticker .run { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); animation: tick 40s linear infinite; font-size: 13px; font-weight: 500; }
.ticker .run span { margin-right: 40px; }
@keyframes tick { from { left: 100%; } to { left: -250%; } }
@media (prefers-reduced-motion: reduce) { .ticker .run { animation: none; left: 8px; } }
main.view { padding: 12px 16px calc(var(--tabbar) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); height: var(--tabbar); }
.tabbar button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); position: relative; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.on { color: var(--accent); }
.tabbar button .dot { position: absolute; top: 8px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* --- Kartlar --- */
.card { background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.card h2 { font-size: 20px; margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; }
.card h2 small { font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--muted); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; letter-spacing: .03em; text-transform: uppercase; }
.pill.good { background: #DFF3E7; color: var(--good); }
.pill.warn { background: #FFF1D6; color: var(--warn); }
.pill.bad { background: #FBE1E2; color: var(--bad); }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 22px; border-radius: 4px; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 14px; padding: 0 6px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-weight: 600; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.red { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-width: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; }

/* Anket çubukları */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 64px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; }
.bar .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .track { background: var(--muted); height: 14px; border-radius: 3px; overflow: hidden; position: relative; }
.bar .fill { height: 100%; border-radius: 3px; }
.bar .thr { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 2px dashed var(--accent); }
.bar .val { text-align: right; font-family: var(--f-display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.bar .delta { font-size: 11px; font-weight: 600; }

/* Haber akışı */
.news-item { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 8px 0; font-size: 14px; }
.news-item .d { font-size: 11px; color: var(--ink-2); font-weight: 600; padding-top: 2px; }
.news-item.player .x { font-weight: 600; }
.news-item.event .x { color: var(--accent); font-weight: 700; }

/* Manşet olay kartı */
.headline { background: rgba(255, 255, 255, .94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.headline .flag { background: var(--accent); color: #fff; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; font-size: 13px; padding: 4px 14px; display: flex; justify-content: space-between; }
.headline .body { padding: 14px; }
.headline h3 { font-family: var(--f-news); font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -.005em; margin-bottom: 8px; }
.headline p { font-family: var(--f-news); font-size: 16px; line-height: 1.5; margin: 0 0 12px; color: var(--ink); max-width: 62ch; }
.opt { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.opt .ol { font-weight: 700; }
.opt .oe { font-size: 12px; color: var(--ink-2); margin-top: 3px; }

/* Harita */
.mapwrap { position: relative; background: #E8EEF6; border-radius: var(--r); overflow: hidden; touch-action: none; aspect-ratio: 2 / 1.05; max-width: 100%; }
.mapwrap svg { width: 100%; height: 100%; display: block; }
.mapwrap path { stroke: #fff; stroke-width: .8; vector-effect: non-scaling-stroke; transition: fill .3s; }
.mapwrap path.sel { stroke: var(--ink); stroke-width: 2.2; }
.mapwrap .zoombtns { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
.mapwrap .zoombtns button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 18px; line-height: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.gradient { height: 8px; border-radius: 4px; flex: 1; min-width: 120px; }

/* Alt sayfa (sheet) ve modal */
.overlay { position: fixed; inset: 0; background: rgba(20, 33, 61, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: -6px auto 0; }
.sheet h2 { font-size: 24px; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 60; font-weight: 600; max-width: calc(100% - 32px); }

/* Formlar */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
input.in, select.in, textarea.in { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); width: 100%; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.axis { display: grid; grid-template-columns: 1fr; gap: 2px; }
.axis .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); font-weight: 600; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
.colors button.on { border-color: var(--ink); }
.select-card { border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px; text-align: left; width: 100%; display: flex; gap: 10px; align-items: flex-start; }
.select-card.on { border-color: var(--ink); background: #EEF2F9; }
.select-card:disabled { opacity: .45; }

/* Başlangıç ekranı */
.splash { background: var(--ink); color: #fff; border-radius: var(--r); padding: 22px 18px; position: relative; overflow: hidden; }
.splash h1 { font-size: 40px; line-height: .95; text-transform: uppercase; }
.splash h1 em { font-style: normal; color: var(--hi); }
.splash p { opacity: .85; margin: 10px 0 0; max-width: 46ch; }
.splash .stripe { position: absolute; right: -30px; top: 0; bottom: 0; width: 120px; background: repeating-linear-gradient(135deg, var(--accent) 0 14px, transparent 14px 28px); opacity: .35; }

/* Seçim gecesi */
.night { position: fixed; inset: 0; background: var(--ink); color: #fff; z-index: 70; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.night .inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.night h1 { font-size: 34px; text-transform: uppercase; }
.night .live { display: inline-flex; gap: 6px; align-items: center; background: var(--accent); padding: 3px 10px; border-radius: 4px; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; }
.night .mapwrap { background: #1E2D50; }
.night .card { color: var(--ink); }
.counter { font-family: var(--f-display); font-size: 15px; opacity: .8; }
.hemi { width: 100%; height: auto; display: block; }

/* Karakter oluşturma */
.charhead { display: flex; gap: 14px; align-items: flex-start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5; }
.charportrait { border-radius: 14px; overflow: hidden; flex: none; box-shadow: 0 2px 10px rgba(20,33,61,.15); }
.charsec { display: flex; flex-direction: column; gap: 12px; }
.charsec .f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.colors button { box-shadow: inset 0 0 0 1px rgba(20,33,61,.15); }

/* Canlı yayın */
.tv { position: fixed; inset: 0; z-index: 80; background: #0B1226; color: #fff; overflow-y: auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tv-screen { position: relative; max-width: 720px; width: 100%; margin: 0 auto; aspect-ratio: 16 / 12.5; max-height: 56vh; overflow: hidden;
  background: radial-gradient(90% 70% at 50% 30%, #2C4A8C 0%, #16264D 55%, #0B1226 100%); }
.tv-screen::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, rgba(255,255,255,.05) 0 2px, transparent 2px 60px); }
.tv-top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 2; font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; font-size: 13px; }
.tv-bug { background: #fff; color: var(--ink); padding: 2px 8px; border-radius: 3px; }
.tv-live { background: var(--accent); padding: 2px 8px; border-radius: 3px; animation: blink 1.6s infinite; }
.tv-prog { margin-left: auto; opacity: .85; }
@keyframes blink { 50% { opacity: .55; } }
.tv-stage { position: absolute; inset: 44px 0 64px; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 6%; }
.tv-desk { position: absolute; left: 4%; right: 4%; bottom: 0; height: 26%; background: linear-gradient(180deg, #E7ECF5, #9FB0CF); border-radius: 10px 10px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.25); }
.tv-guest { position: relative; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 1; width: 40%; }
.tv-frame { width: min(118px, 30vw); border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.35); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.tv-frame svg { width: 100%; height: auto; }
.tv-frame.me { border-color: var(--hi); }
.tv-guest figcaption { font-family: var(--f-display); font-weight: 700; font-size: 14px; background: rgba(11,18,38,.8); padding: 2px 8px; border-radius: 4px; text-align: center; line-height: 1.1; }
.tv-guest figcaption small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 10px; opacity: .8; }
.tv-lower { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; align-items: stretch; height: 34px; z-index: 2; }
.tv-lower-tag { background: var(--accent); font-family: var(--f-display); font-weight: 700; padding: 0 10px; display: flex; align-items: center; font-size: 13px; letter-spacing: .05em; }
.tv-lower span:last-child { background: #fff; color: var(--ink); flex: 1; display: flex; align-items: center; padding: 0 10px; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv-crawl { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: var(--hi); color: var(--ink); overflow: hidden; z-index: 2; font-size: 12px; font-weight: 600; }
.tv-crawl span { position: absolute; white-space: nowrap; top: 50%; transform: translateY(-50%); animation: tick 30s linear infinite; }
@media (prefers-reduced-motion: reduce) { .tv-crawl span, .tv-live { animation: none; } }
.tv-panel { max-width: 720px; width: 100%; margin: 0 auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.tv-meter { background: rgba(255,255,255,.06); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.tv-meter-v { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--hi); }
.tv-bar { position: relative; height: 10px; background: rgba(255,255,255,.12); border-radius: 5px; overflow: hidden; }
.tv-bar > div { height: 100%; background: linear-gradient(90deg, var(--hi), #FFE08A); transition: width .8s ease; }
.tv-bar i { position: absolute; top: 0; bottom: 0; border-left: 2px solid #fff; }
.tv-factions { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.tv-fac { display: grid; grid-template-columns: minmax(0, 1fr) 70px 26px 40px; gap: 6px; align-items: center; font-size: 12px; }
.tv-fac span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.tv-fbar { height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
.tv-fbar div { height: 100%; background: #9FB7E8; transition: width .8s ease; }
.tv-fac em { font-style: normal; font-weight: 700; font-size: 12px; text-align: right; }
.tv-fac em.up, .tv-react.up b { color: #6EE7A0; }
.tv-fac em.down, .tv-react.down b { color: #FF8A8A; }
.tv-qnum { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.tv-q { font-family: var(--f-news); font-size: 21px; line-height: 1.3; margin: 4px 0 0; min-height: 2.6em; cursor: pointer; }
.tv-answers { display: flex; flex-direction: column; gap: 8px; }
.tv-ans { text-align: left; background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 12px 14px; font-weight: 600; font-size: 15px; }
.tv-ans:not(:disabled):hover { background: rgba(255,255,255,.16); }
.tv-ans:disabled { opacity: .4; }
.tv-react { display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px; font-size: 14px; }
.tv-react b { font-family: var(--f-display); font-size: 24px; }
.tv-next { width: 100%; padding: 14px; }
.topav { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex: none; border: 2px solid var(--hi); }
.topav svg { width: 36px; height: auto; margin-top: -2px; }
.portrait { border-radius: 12px; overflow: hidden; flex: none; box-shadow: 0 2px 8px rgba(20,33,61,.15); }
.pname { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1.1; }
.kcount { margin-top: 6px; font-size: 13px; }
.kcount b { font-family: var(--f-display); font-size: 20px; color: var(--accent); }
.kbar, .kfbar { position: relative; background: var(--muted); border-radius: 6px; overflow: hidden; }
.kbar { height: 14px; }
.kbar > div, .kfbar > div { height: 100%; transition: width .6s ease; }
.kbar i { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--ink); }

.cc { --cc-bg: #0A1226; --cc-panel: #0F1A33; --cc-line: #24365C; --cc-blue: #4EA3FF; --cc-gold1: #E9D29A; --cc-gold2: #B8904A; --cc-ink: #E8EEF9; --cc-mute: #94A3BF;
  margin: -12px -16px 0; padding: 14px 16px calc(96px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(120% 60% at 50% 0%, #1A2B52 0%, var(--cc-bg) 60%); color: var(--cc-ink); min-height: 100vh; display: flex; flex-direction: column; gap: 14px; }

.cc-thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 7px; }
.cc-thumbs.outfit, .cc-thumbs.hairStyle { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
.cc-thumb { padding: 0; border: 1.5px solid var(--cc-line); border-radius: 8px; overflow: hidden; background: #C9D3E3; cursor: pointer; position: relative; display: flex; flex-direction: column; }
.cc-thumb svg { width: 100%; height: auto; aspect-ratio: auto; }
.cc-thumbs.eyeColor svg, .cc-thumbs.lips svg, .cc-thumbs.brows svg { min-height: 30px; }
.cc-thumb span { font: 600 10px/1.2 var(--f-body); color: #C9D4E8; background: #0C162E; padding: 3px 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-thumbs.accent .cc-thumb span { display: none; }
.cc-thumb.on { border-color: var(--cc-blue); box-shadow: 0 0 0 2px rgba(78,163,255,.45), 0 0 12px rgba(78,163,255,.5); }
.cc-sw { display: flex; flex-wrap: wrap; gap: 10px; }
.cc-sw button { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 60%); border: 2px solid rgba(255,255,255,.12); cursor: pointer; }
.cc-sw.sq button { border-radius: 8px; width: 42px; background: var(--c); }
.cc-sw button.on { border-color: var(--cc-blue); box-shadow: 0 0 0 3px rgba(78,163,255,.35); }
.cc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cc-chips button { background: #0A1328; border: 1px solid var(--cc-line); color: #C9D4E8; border-radius: 999px; padding: 8px 14px; font: 600 13px var(--f-body); cursor: pointer; }
.cc-chips button.on { background: var(--cc-blue); border-color: var(--cc-blue); color: #04122B; }
.cc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }
.cc-cards button { text-align: left; background: #0A1328; border: 1px solid var(--cc-line); color: var(--cc-ink); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
.cc-cards button span { font-size: 11.5px; color: var(--cc-mute); line-height: 1.3; }
.cc-cards button.on { border-color: var(--cc-blue); box-shadow: inset 0 0 0 1px var(--cc-blue); background: #10264A; }
.cc-cards button:disabled { opacity: .4; }
.cc-toggle { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #C9D4E8; }
.cc-toggle input { width: 20px; height: 20px; accent-color: var(--cc-blue); }
.cc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
.cc-stats { padding: 14px; }
.cc-stats h3 { margin: 0 0 6px; font: 600 14px var(--f-body); letter-spacing: .12em; }
.cc-stat { display: grid; grid-template-columns: 26px 72px 1fr 28px; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid rgba(36,54,92,.6); font-size: 14px; }
.cc-stat .ic { font-size: 16px; text-align: center; }
.cc-stat .cc-bar { height: 7px; border-radius: 4px; background: #1B2A4A; overflow: hidden; }
.cc-stat .cc-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2E7FE0, #6FB8FF); transition: width .35s ease; }
.cc-stat b { text-align: right; }
.cc-stats p { margin: 6px 0 0; font-size: 11.5px; color: var(--cc-mute); }
.cc-foot { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 720px; z-index: 20; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, transparent, rgba(8,14,30,.96) 30%); }
.cc-rand { border: 1px solid var(--cc-line); background: #121F3D; color: #E8EEF9; border-radius: 12px; font: 600 14px var(--f-body); letter-spacing: .08em; padding: 14px 8px; cursor: pointer; }
.cc-ok { border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--cc-gold1), var(--cc-gold2)); color: #1C1608; font: 700 16px var(--f-body); letter-spacing: .1em; padding: 14px 10px; cursor: pointer; box-shadow: 0 6px 20px rgba(184,144,74,.35), inset 0 1px 0 rgba(255,255,255,.5); display: flex; justify-content: center; gap: 10px; }
.cc-ok span { font-size: 20px; line-height: .8; }
@media (min-width: 640px) {
  .cc-main { grid-template-columns: 1fr 1fr; align-items: start; }
  .cc-hero { grid-row: span 2; height: 520px; position: sticky; top: 12px; }
  .cc-hero-p { width: 340px; right: -40px; }
  .cc-id, .cc-panel { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .cc-arch, .cc-stat .cc-bar i { transition: none; } }
main.view:has(> .cc) { padding-bottom: 0; }
.crisis-timer { font: 600 12.5px var(--f-body); background: #FFF4E5; color: #8A4B00; border: 1px solid #F5C77E; border-radius: 8px; padding: 6px 10px; margin: 4px 0 8px; }
.crisis-timer.hot { background: #FDECEC; color: var(--bad); border-color: #F2A7A7; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.choice-grid { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 6px; }
.choice-grid.many { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.select-card.choice { padding: 8px 10px; align-items: flex-start; gap: 8px; text-align: left; }
.select-card.choice .ci { font-size: 22px; line-height: 1.1; width: 26px; text-align: center; flex: none; }
.select-card.choice .cdesc { margin-top: 2px; font-size: 11.5px; }
.select-card.choice.dirty { border-color: #F2A7A7; background: #FFF6F6; }
.select-card.choice:disabled { opacity: .5; }
.lvl { display: flex; gap: 3px; margin-top: 4px; }
.lvl i { width: 18px; height: 5px; border-radius: 3px; background: var(--line); }
.lvl i.on { background: var(--good); }
/* Etki çipleri */
.fx-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.fx-chips .fx { font: 600 12px var(--f-body); padding: 5px 9px; border-radius: 999px; background: var(--muted); animation: up .3s both; }
.fx-chips .fx.up { background: #E3F4EA; color: #17663A; }
.fx-chips .fx.down { background: #FDECEC; color: var(--bad); }
/* Stüdyo */
.sc-studio { position: relative; overflow: hidden; background: #070C18; }
.st-bg { position: absolute; inset: 0; }
.st-onair { position: absolute; top: 10px; left: 12px; background: var(--accent); color: #fff; font: 700 11px var(--f-body); letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; animation: pulse 1.2s infinite; }
.st-logo { position: absolute; top: 10px; right: 12px; color: #fff; font: 600 12px var(--f-body); opacity: .85; }
.st-host { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); animation: up .5s both; }
.st-desk { position: absolute; left: 10%; right: 10%; bottom: 0; height: 46px; background: linear-gradient(180deg, #2A3550, #141B2E); border-top: 4px solid; border-radius: 10px 10px 0 0; }
.st-lower { position: absolute; left: 12px; bottom: 54px; background: rgba(255,255,255,.95); border-left: 5px solid var(--accent); padding: 5px 10px; display: flex; flex-direction: column; animation: slidein .5s .6s both; }
.st-lower b { font: 700 15px var(--f-display); } .st-lower span { font-size: 11px; color: var(--ink-2); }
.st-meter { position: absolute; right: 12px; bottom: 54px; color: #fff; text-align: right; font-size: 11px; } .st-meter b { display: block; font: 700 20px var(--f-display); color: var(--hi); }
@keyframes slidein { from { transform: translateX(-30px); opacity: 0; } }
/* Vaat */
.pm-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.pm-banner { position: absolute; top: 14px; left: 8%; right: 8%; color: #fff; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: drop .6s .2s both; }
.pm-banner span { font-size: 28px; } .pm-banner b { font: 700 17px/1.1 var(--f-display); }
@keyframes drop { from { transform: translateY(-80px); opacity: 0; } }
.pm-speaker { margin-bottom: -6px; }
.pm-cost { position: absolute; right: 12px; bottom: 14px; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 11px; text-align: right; animation: up .4s 1.2s both; } .pm-cost b { display: block; font: 700 18px var(--f-display); }

.op-file { position: relative; width: 62%; max-width: 260px; aspect-ratio: 1.3; background: #E9D8A6; border-radius: 4px 10px 10px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; animation: up .5s both; color: #3A2A10; }
.op-file.dirty { background: #CBB98A; }
.op-tab { position: absolute; top: -16px; left: 0; color: #fff; font: 700 12px var(--f-display); padding: 2px 10px; border-radius: 4px 4px 0 0; }
.op-file b { font: 800 22px var(--f-display); letter-spacing: .2em; } .op-file i { font-style: normal; font-size: 30px; } .op-file small { font-size: 11px; text-align: center; padding: 0 10px; }

.if-card { background: #fff; border-radius: 14px; padding: 18px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow); animation: up .4s both; }
.if-ico { font-size: 40px; } .if-lvl { display: flex; gap: 6px; } .if-lvl i { width: 34px; height: 10px; border-radius: 5px; background: var(--line); }

.meters { display: grid; gap: 12px; }
.meter .mbar, .segrow .mbar, .card > .mbar { height: 8px; border-radius: 4px; background: var(--muted); overflow: hidden; margin: 4px 0; }
.mbar i { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
.segrow { display: grid; grid-template-columns: 22px minmax(0, 1.3fr) 1fr 48px; gap: 8px; align-items: center; font-size: 13px; padding: 3px 0; }
.segrow .sl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .segrow b { text-align: right; }
.mob { display: flex; align-items: center; justify-content: center; gap: 18px; background: var(--bg); border-radius: 10px; padding: 10px; }
.mob div { display: flex; flex-direction: column; align-items: center; } .mob b { font: 700 26px var(--f-display); } .mob .arrow { font-size: 22px; color: var(--ink-2); }
.mini-meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.mm { display: grid; grid-template-columns: auto 1fr auto; gap: 4px; align-items: center; font-size: 12px; }
.mmbar { height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; } .mmbar i { display: block; height: 100%; }
@media (max-width: 420px) { .mini-meters { grid-template-columns: repeat(2, 1fr); } }
.mini-link { display: block; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; font: inherit; }
